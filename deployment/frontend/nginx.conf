# Static frontend for a separately hosted HTTPS API. Configure VITE_API_BASE_URL
# as the public API URL at build time. For same-origin /api, replace this file
# with nginx.proxy.conf.example and configure the upstream on a private network.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ {
    default_type application/json;
    return 503 '{"error":"API_PROXY_NOT_CONFIGURED"}';
  }
  location / { try_files $uri $uri/ /index.html; }
}
